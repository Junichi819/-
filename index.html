const regions = ['全国','北海道・東北','関東','中部','近畿','中国・四国','九州・沖縄'];
const regionColors = {
  '北海道・東北': '#378ADD',
  '関東': '#D85A30',
  '中部': '#1D9E75',
  '近畿': '#7F77DD',
  '中国・四国': '#BA7517',
  '九州・沖縄': '#D4537E',
};

const national = [1.45,1.44,1.43,1.42,1.36,1.33,1.30,1.26,1.20,1.15];

let currentRegion = '全国';
let chartInstance = null;

function getDatasets(region) {
  const filtered = region === '全国' ? raw : raw.filter(d => d.region === region);
  const ds = filtered.map(d => ({
    label: d.name,
    data: d.data,
    borderColor: region === '全国' ? regionColors[d.region] : regionColors[d.region],
    backgroundColor: 'transparent',
    borderWidth: 1.2,
    pointRadius: 0,
    tension: 0.3,
  }));
  ds.unshift({
    label: '全国平均',
    data: national,
    borderColor: '#2C2C2A',
    backgroundColor: 'transparent',
    borderWidth: 2.5,
    pointRadius: 3,
    tension: 0.3,
    borderDash: [],
  });
  return ds;
}

function buildLegend(region) {
  const legendEl = document.getElementById('legend');
  if (region === '全国') {
    legendEl.innerHTML = Object.entries(regionColors).map(([r,c]) =>
      `<span class="legend-item"><span class="legend-dot" style="background:${c}"></span>${r}</span>`
    ).join('') + `<span class="legend-item"><span class="legend-dot" style="background:#2C2C2A"></span>全国平均</span>`;
  } else {
    legendEl.innerHTML = `<span class="legend-item"><span class="legend-dot" style="background:${regionColors[region]}"></span>${region}各県</span><span class="legend-item"><span class="legend-dot" style="background:#2C2C2A"></span>全国平均</span>`;
  }
}

function buildChart(region) {
  const ctx = document.getElementById('tfrChart').getContext('2d');
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels: years, datasets: getDatasets(region) },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          mode: 'index',
          intersect: false,
          callbacks: {
            label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)}`
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#888780', font: { size: 12 }, autoSkip: false },
          grid: { color: 'rgba(136,135,128,0.15)' }
        },
        y: {
          min: 0.85,
          max: 2.05,
          ticks: { color: '#888780', font: { size: 12 }, callback: v => v.toFixed(2) },
          grid: { color: 'rgba(136,135,128,0.15)' }
        }
      },
      interaction: { mode: 'nearest', axis: 'x', intersect: false }
    }
  });
}

function buildButtons() {
  const container = document.getElementById('regionBtns');
  regions.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'btn' + (r === currentRegion ? ' active' : '');
    btn.textContent = r;
    btn.onclick = () => {
      currentRegion = r;
      document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      buildLegend(r);
      buildChart(r);
    };
    container.appendChild(btn);
  });
}

buildButtons();
buildLegend(currentRegion);
buildChart(currentRegion);
