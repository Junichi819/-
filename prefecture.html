const natBase = 1.36;
const natData = [1.36,1.33,1.30,1.26,1.20,1.15];

const regions = ['全国','北海道・東北','関東','中部','近畿','中国・四国','九州・沖縄'];
const rColors = {
  '北海道・東北':'#378ADD',
  '関東':'#D85A30',
  '中部':'#1D9E75',
  '近畿':'#7F77DD',
  '中国・四国':'#BA7517',
  '九州・沖縄':'#D4537E',
};

let cur = '全国';
let ci = null;

function chgRate(arr, base) {
  return arr.map(v => parseFloat(((v/base-1)*100).toFixed(2)));
}

function getDS(region) {
  const filtered = region === '全国' ? raw : raw.filter(d => d.region === region);
  const ds = filtered.map(d => ({
    label: d.name,
    data: chgRate(d.data, d.base),
    borderColor: rColors[d.region],
    backgroundColor: 'transparent',
    borderWidth: 1.2,
    pointRadius: 0,
    tension: 0.3,
  }));
  ds.unshift({
    label: '全国平均',
    data: chgRate(natData, natBase),
    borderColor: '#2C2C2A',
    backgroundColor: 'transparent',
    borderWidth: 2.5,
    pointRadius: 3,
    tension: 0.3,
  });
  return ds;
}

function buildLeg(region) {
  const el = document.getElementById('leg');
  const items = region === '全国'
    ? Object.entries(rColors).map(([r,c]) => `<span><b style="background:${c}"></b>${r}</span>`).join('')
    : `<span><b style="background:${rColors[region]}"></b>${region}各県</span>`;
  el.innerHTML = items + `<span><b style="background:#2C2C2A"></b>全国平均</span>`;
}

function buildChart(region) {
  const ctx = document.getElementById('ch').getContext('2d');
  if (ci) ci.destroy();
  ci = new Chart(ctx, {
    type: 'line',
    data: { labels: years, datasets: getDS(region) },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          mode: 'index',
          intersect: false,
          callbacks: {
            label: c => {
              const v = c.parsed.y;
              return `${c.dataset.label}: ${v >= 0 ? '+' : ''}${v.toFixed(1)}%`;
            }
          }
        }
      },
      scales: {
        x: {
          ticks: { color:'#888780', font:{size:12}, autoSkip:false },
          grid: { color:'rgba(136,135,128,0.15)' }
        },
        y: {
          ticks: {
            color:'#888780', font:{size:12},
            callback: v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%'
          },
          grid: { color:'rgba(136,135,128,0.15)' },
          afterDataLimits(scale) {
            scale.max = Math.max(scale.max, 2);
            scale.min = Math.min(scale.min, -22);
          }
        }
      }
    }
  });
}

function buildBtns() {
  const c = document.getElementById('btns');
  regions.forEach(r => {
    const b = document.createElement('button');
    b.className = 'btn' + (r === cur ? ' active' : '');
    b.textContent = r;
    b.onclick = () => {
      cur = r;
      document.querySelectorAll('.btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      buildLeg(r);
      buildChart(r);
    };
    c.appendChild(b);
  });
}

buildBtns();
buildLeg(cur);
