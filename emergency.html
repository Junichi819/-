const natBase=1.36, natData=[1.36,1.33,1.30,1.26,1.20,1.15];

const groups = [
  {label:'1回（31県）',ec:1,color:'#1D9E75'},
  {label:'2回（8県）',ec:2,color:'#378ADD'},
  {label:'3回（7都府県）',ec:3,color:'#BA7517'},
  {label:'4回（東京・沖縄）',ec:4,color:'#D85A30'},
];

function chgRate(arr,base){return arr.map(v=>parseFloat(((v/base-1)*100).toFixed(2)));}

function avgRate(ecNum){
  const prefs=raw.filter(d=>d.ec===ecNum);
  return years.map((_,yi)=>{
    const avg=prefs.reduce((s,d)=>s+(d.data[yi]/d.base-1)*100,0)/prefs.length;
    return parseFloat(avg.toFixed(2));
  });
}

let mode='avg';
let ci=null;

function getDS(){
  const ds=groups.map(g=>({
    label: mode==='avg' ? g.label+'（平均）' : g.label,
    data: mode==='avg' ? avgRate(g.ec) : raw.filter(d=>d.ec===g.ec).map(d=>({name:d.name,data:chgRate(d.data,d.base)})),
    borderColor:g.color,
    backgroundColor:'transparent',
    borderWidth: mode==='avg' ? 2.5 : 1.2,
    pointRadius: mode==='avg' ? 3 : 0,
    tension:0.3,
    _ec:g.ec,
    _color:g.color,
  }));

  if(mode==='all'){
    const expanded=[];
    ds.forEach(g=>{
      raw.filter(d=>d.ec===g._ec).forEach(d=>{
        expanded.push({
          label:d.name,
          data:chgRate(d.data,d.base),
          borderColor:g._color,
          backgroundColor:'transparent',
          borderWidth:1.2,
          pointRadius:0,
          tension:0.3,
        });
      });
    });
    expanded.push({label:'全国平均',data:chgRate(natData,natBase),borderColor:'#2C2C2A',backgroundColor:'transparent',borderWidth:2.5,pointRadius:3,tension:0.3});
    return expanded;
  }

  ds.push({label:'全国平均',data:chgRate(natData,natBase),borderColor:'#2C2C2A',backgroundColor:'transparent',borderWidth:2.5,pointRadius:3,tension:0.3});
  return ds;
}

function buildLeg(){
  const el=document.getElementById('leg');
  el.innerHTML=groups.map(g=>`<span><b style="background:${g.color}"></b>${g.label}</span>`).join('')+
    `<span><b style="background:#2C2C2A"></b>全国平均</span>`;
}

function buildPrefList(){
  const el=document.getElementById('prefList');
  el.innerHTML=groups.map(g=>{
    const names=raw.filter(d=>d.ec===g.ec).map(d=>d.name).join('・');
    return `<span style="color:${g.color};font-weight:500">${g.ec}回：</span>${names}`;
  }).join('<br>');
}

function buildChart(){
  const ctx=document.getElementById('ch').getContext('2d');
  if(ci)ci.destroy();
  ci=new Chart(ctx,{
    type:'line',
    data:{labels:years,datasets:getDS()},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          mode:'index',intersect:false,
          callbacks:{label:c=>{const v=c.parsed.y;return `${c.dataset.label}: ${v>=0?'+':''}${v.toFixed(1)}%`;}}
        }
      },
      scales:{
        x:{ticks:{color:'#888780',font:{size:12},autoSkip:false},grid:{color:'rgba(136,135,128,0.15)'}},
        y:{
          ticks:{color:'#888780',font:{size:12},callback:v=>(v>=0?'+':'')+v.toFixed(1)+'%'},
          grid:{color:'rgba(136,135,128,0.15)'},
          afterDataLimits(scale){scale.max=Math.max(scale.max,2);scale.min=Math.min(scale.min,-22);}
        }
      }
    }
  });
}

function buildBtns(){
  const c=document.getElementById('btns');
  [{id:'avg',label:'グループ平均'},{id:'all',label:'全県表示'}].forEach(m=>{
    const b=document.createElement('button');
    b.className='btn'+(m.id===mode?' active':'');
    b.textContent=m.label;
    b.onclick=()=>{
      mode=m.id;
      document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      buildChart();
    };
    c.appendChild(b);
  });
}

buildBtns();
buildLeg();
buildPrefList();
buildChart();
</script>
